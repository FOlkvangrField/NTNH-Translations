name: Sync HBM en_US Source

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hbm-source-updated]
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync hbm en_US source from NTNH mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NTNH-Translations repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 0

      - name: Checkout HBM mod repository
        uses: actions/checkout@v4
        with:
          repository: NTNewHorizons/Hbm-s-Nuclear-Tech-GIT
          ref: spacetravel-two-pointfive
          path: hbm-upstream
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync hbm en_US.lang -> en_US.properties
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          SRC="hbm-upstream/src/main/resources/assets/hbm/lang/en_US.lang"
          DST="config/txloader/forceload/hbm/lang/en_US.properties"

          if [ ! -f "$SRC" ]; then
            echo "::error::Source file not found in HBM mod repo: $SRC"
            exit 1
          fi

          mkdir -p "$(dirname "$DST")"

          # Strip BOM and CRLF so the Crowdin source matches the repo format
          sed '1s/^\xEF\xBB\xBF//' "$SRC" | sed 's/\r$//' > "$DST.tmp"

          if [ -f "$DST" ] && diff -q "$DST" "$DST.tmp" > /dev/null 2>&1; then
            rm "$DST.tmp"
            echo "No changes: $DST is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv "$DST.tmp" "$DST"
            echo "✓ Updated: $DST"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          rm -rf hbm-upstream

          git add config/txloader/forceload/hbm/lang/en_US.properties

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🌐 Sync hbm en_US source from NTNH mod (spacetravel-two-pointfive)"
            git push origin main
            echo "✓ Pushed hbm en_US source update"
          fi
